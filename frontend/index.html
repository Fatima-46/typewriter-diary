<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Typewriter Diary</title>
<meta name="description" content="A shared, anonymous diary — type a thought, file it, and it joins a public stack of pages left by strangers.">

<!-- Bootstrap (free CDN) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Fonts (free) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<!-- Custom styles -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="container-diary">

  <header class="masthead">
    <p class="masthead-eyebrow">A Shared Diary, Kept By No One</p>
    <h1 class="masthead-title">The Typewriter Diary</h1>
    <p class="masthead-sub">Type a thought. File it. It joins the pile below, exactly as anonymous as everything else here.</p>
  </header>

  <!-- Typewriter device: compose area -->
  <section class="typewriter-device" aria-label="Write a new entry">
    <div class="carriage-rail" aria-hidden="true"></div>

    <div class="paper-sheet-well" id="paperSheetWell">
      <div class="paper-sheet" id="paperSheet">
        <label for="entryTextarea" class="visually-hidden">Write your entry</label>
        <textarea
          id="entryTextarea"
          class="entry-textarea"
          maxlength="700"
          placeholder="Dear diary..."
          aria-describedby="charCounter composeStatus"
        ></textarea>
      </div>
    </div>

    <div class="typewriter-controls">
      <span class="char-counter" id="charCounter">0 / 700</span>
      <button class="file-entry-btn" id="fileEntryBtn" type="button" disabled>
        File this entry
      </button>
    </div>
    <p class="compose-status" id="composeStatus" role="status" aria-live="polite"></p>
  </section>

  <!-- Diary feed -->
  <h2 class="feed-heading">Pages Already Filed</h2>
  <section class="diary-feed" id="diaryFeed" aria-label="Filed entries">
    <p class="empty-feed" id="emptyFeedMsg">No pages filed yet — be the first.</p>
  </section>

  <div class="load-more-row">
    <button class="load-more-btn" id="loadMoreBtn" type="button" style="display:none;">
      Turn to older pages
    </button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/typewriter.js"></script>
<script src="js/entries.js"></script>
<script src="js/main.js"></script>
</body>
</html>
